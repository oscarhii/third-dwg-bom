<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="在瀏覽器中批次將 DWG 的 ITEM、QTY、CATALOG NUMBER 表格轉成 CSV。" />
    <title>DWG BOM → CSV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="回首頁">
          <span class="brand-mark">D/C</span>
          <span>DWG BOM 轉換器</span>
        </a>
        <span class="privacy"><i></i> 本機處理・不上傳</span>
      </header>

      <main class="app-layout">
        <section class="workspace upload-panel" aria-labelledby="upload-title">
          <div class="compact-intro">
            <p class="eyebrow">DWG → STRUCTURED DATA</p>
            <h1>圖面料表，<em>一鍵帶出。</em></h1>
            <p class="lede">批次讀取 ITEM、QTY、CATALOG NUMBER，檔案全程只在瀏覽器本機處理。</p>
          </div>
          <div class="workspace-head">
            <div>
              <span class="step">01</span>
              <h2 id="upload-title">加入 DWG 檔案</h2>
            </div>
            <label class="header-option"><input id="includeHeader" type="checkbox" /><span></span>CSV 包含欄位名稱</label>
          </div>

          <label class="dropzone compact-dropzone" id="dropzone" for="fileInput">
            <input id="fileInput" type="file" accept=".dwg,application/acad,application/x-acad" multiple />
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="M24 32V10m0 0-8 8m8-8 8 8M10 31v5a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-5" /></svg>
            </span>
            <strong>拖曳 DWG 到這裡</strong>
            <span>或點擊選擇多個檔案</span>
            <small>支援 AutoCAD DWG・可一次處理多檔</small>
          </label>

          <div class="engine-status" id="engineStatus">
            <span class="spinner"></span><span>正在準備 DWG 解析引擎…</span>
          </div>
        </section>

        <section class="results result-panel" id="resultsSection" aria-live="polite">
          <div class="results-head">
            <div><span class="step">02</span><h2>轉換結果</h2></div>
            <div class="result-actions">
              <button class="ghost-button" id="clearButton" type="button">清除全部</button>
              <button class="primary-button" id="zipButton" type="button" disabled>
                <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14" /></svg>
                下載全部 ZIP
              </button>
            </div>
          </div>
          <div class="summary" id="summary"></div>
          <div class="empty-state" id="emptyState">
            <span>02</span>
            <h3>解析結果會顯示在這裡</h3>
            <p>從左側加入一個或多個 DWG 檔案</p>
          </div>
          <div class="result-content" id="resultContent" hidden>
            <div class="file-tabs" id="fileTabs" role="tablist"></div>
            <div class="active-result" id="activeResult"></div>
          </div>
        </section>
      </main>

      <footer>
        <span>DWG BOM → CSV</span>
        <span>Powered by <a href="https://github.com/mlightcad/libredwg-web" target="_blank" rel="noreferrer">LibreDWG Web</a> (GPL-3.0)</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
